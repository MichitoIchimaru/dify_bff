<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャットボット</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    .chat-container {
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 10px;
    }

    .chat-area {
      height: 90%;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
      padding: 10px;
    }

    .input-container {
      display: flex;
      margin-top: 10px;
    }

    .input-container input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .input-container button {
      margin-left: 5px;
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .input-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-area" id="chatArea">
      <p>チャットを開始してください...</p>
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="メッセージを入力">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="botmanager.js"></script>
  <script>
    const botManager = new BotManager()
    async function sendMessage() {
      const input = document.getElementById("userInput")
      const chatArea = document.getElementById("chatArea")
      const message = input.value.trim()

      if (message !== "") {
        const newMessage = document.createElement("div")
        newMessage.innerHTML = `あなた： ${message}`
        input.value = ""
        chatArea.appendChild(newMessage)
        chatArea.scrollTop = chatArea.scrollHeight;

        // 問い合わせ
        const answer = marked.parse(await botManager.query(message))
        const ansMessage = document.createElement("div")
        ansMessage.innerHTML = `ボット： ${answer}`
        chatArea.appendChild(ansMessage)

        input.value = ""
        chatArea.scrollTop = chatArea.scrollHeight;
        document.getElementById("userInput").focus()
      }
    }
  </script>
</body>

</html>
